# ===========================================================================
# ChromaDB for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : chromadb/chroma:1.5.9 (Docker Hub, used unmodified)
#                  -> https://github.com/chroma-core/chroma
#
# Ports   : host 8141 -> container 8000. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/chromadbdocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add, explicit TZ, a healthcheck on the only service, and
#           x-app-meta as the last block.
# Hardening: capabilities are dropped, no-new-privileges is set and the
#           container root filesystem is read-only; the database directory
#           (the only writable path besides /tmp) is the mounted volume.
# Telemetry: upstream ChromaDB 0.6.x reports anonymized usage telemetry to
#           PostHog by default. 1.x ships no telemetry provider by default and
#           this package additionally pins ANONYMIZED_TELEMETRY=False so the
#           switch is explicit. See PRIVACY.md; nothing is sent while the
#           variable stays False.
# Escaping: docker compose interpolates ${VAR}/$VAR in compose files, so any
#           '$' meant for the shell is written '$$'. This file contains none.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  chromadbdocker:
    image: chromadb/chroma:1.5.9
    container_name: chromadbdocker
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "8141:8000"
    environment:
      TZ: "Asia/Shanghai"
      ANONYMIZED_TELEMETRY: "False"
    volumes:
      - /Volume1/DockerAppData/chromadbdocker/data:/data
    tmpfs:
      - /tmp:mode=1777
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8141
    protocol: http
